<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PeerDrop</title>
    <!-- Wails-safe CSS path -->
</head>
<body>
<div id="container">

    <!-- Left panel -->
    <div id="main-column">
        <h2>Send File</h2>

        <div id="receiver-container">
            <label for="receiver-select">Receiver:</label>
            <select id="receiver-select">
                <option value="" disabled selected>Select a peer</option>
            </select>
        </div>

        <form id="upload-form">
            <button type="button" id="pick-file">Pick File</button>
            <span id="file-name">No file selected</span>
            <button type="submit" id="send-btn" disabled>Send</button>
        </form>
    </div>

    <!-- Right panel -->
    <div id="sidebar-column">
        <h2>Connected Peers</h2>
        <ul id="peer-list"></ul>
    </div>

</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
